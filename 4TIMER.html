:root {
  --bg: #050506;
  --panel: #151517;
  --panel-2: #1f1f22;
  --line: #2b2b30;
  --chalk: #f3f2ee;
  --ink: #101012;
  --muted: #9a9aa1;
  --red: #ff2d2d;
  --blue: #3a74ff;
  --orange: #f5921e;
  --rest: #26e08e;
  --radius: 18px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--chalk); }
body {
  font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  font-weight: 600; font-size: 20px; line-height: 1.25;
  overscroll-behavior: none; user-select: none; -webkit-user-select: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { min-height: 100dvh; }
.screen { min-height: 100dvh; padding: calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 24px); max-width: 640px; margin: 0 auto; }

/* ---------- Cabecera ---------- */
.top { display: flex; align-items: center; gap: 12px; min-height: 56px; margin-bottom: 14px; }
.top .grow { flex: 1; min-width: 0; }
.wordmark { font-weight: 800; font-style: italic; font-size: 38px; line-height: 1; letter-spacing: -0.5px; }
.wordmark .four { color: transparent; -webkit-text-stroke: 2px var(--orange); margin-right: 1px; }
.gymname { color: var(--muted); font-size: 16px; margin-top: 2px; }
.gym-logo.round { border-radius: 50%; height: 46px; width: 46px; }
.gym-logo { height: 40px; width: auto; max-width: 110px; object-fit: contain; border-radius: 6px; display: block; }
.title { font-weight: 800; font-style: italic; font-size: 32px; line-height: 1.05; margin: 0; }
.icon-btn { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); flex: none; }
.icon-btn svg { width: 26px; height: 26px; }

/* ---------- Lista de modos (como la referencia, en español) ---------- */
.modes { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.card {
  width: 100%; text-align: left; display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: center;
  background: var(--chalk); color: var(--ink); border-radius: var(--radius); padding: 14px 16px; min-height: 84px;
}
.card:active { transform: scale(0.985); }
.card svg { width: 40px; height: 40px; }
.card .c-title { display: block; font-weight: 800; font-style: italic; font-size: 30px; line-height: 1; }
.card .c-desc { display: block; font-size: 19px; line-height: 1.15; margin-top: 3px; color: #2b2b2f; }
.card.accent { background: var(--orange); }
.card.accent .c-desc { color: #2a1a05; }
.card.dark { background: var(--panel); color: var(--chalk); border: 1px solid var(--line); }
.card.dark .c-desc { color: var(--muted); }
.card .c-badge { display: block; font-weight: 700; font-size: 18px; color: var(--muted); }

/* ---------- Formularios ---------- */
.lead { color: var(--muted); font-size: 21px; margin: 0 0 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.panel h2 { font-weight: 800; font-style: italic; font-size: 26px; margin: 0 0 10px; }
.field { padding: 12px 0; border-top: 1px solid var(--line); }
.field:first-child { border-top: 0; padding-top: 0; }
.flabel { color: var(--muted); font-size: 19px; margin-bottom: 8px; }
.time-ctl { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.step { display: flex; align-items: center; gap: 6px; }
.step button { width: 52px; height: 52px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); font-size: 30px; font-weight: 700; line-height: 1; }
.step button:active { background: #2c2c31; }
.step output { min-width: 52px; text-align: center; font-weight: 800; font-size: 40px; font-variant-numeric: tabular-nums; }
.unit { color: var(--muted); font-size: 18px; }
.text-in, select.text-in {
  width: 100%; min-height: 52px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line);
  padding: 0 14px; font-size: 22px; user-select: text; -webkit-user-select: text;
}
.total { font-size: 22px; color: var(--muted); margin: 4px 0 14px; }
.total b { color: var(--chalk); font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; }

.btn {
  min-height: 58px; padding: 0 22px; border-radius: 16px; font-weight: 800; font-style: italic; font-size: 26px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--panel-2); border: 1px solid var(--line);
}
.btn svg { width: 26px; height: 26px; }
.btn.primary { background: var(--orange); color: #1b1203; border-color: var(--orange); }
.btn.danger { color: #ff7b7b; }
.btn.block { width: 100%; }
.btn.small { min-height: 46px; font-size: 21px; padding: 0 14px; border-radius: 12px; }
.btn:active { filter: brightness(0.9); }
.btn[disabled] { opacity: 0.4; pointer-events: none; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 21px; }
.switch:first-of-type { border-top: 0; }
.switch input { appearance: none; -webkit-appearance: none; width: 58px; height: 34px; border-radius: 20px; background: #3a3a40; position: relative; flex: none; transition: background .15s; }
.switch input::after { content: ''; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: var(--chalk); transition: transform .15s; }
.switch input:checked { background: var(--orange); }
.switch input:checked::after { transform: translateX(24px); }
input[type=range] { width: 100%; accent-color: var(--orange); height: 36px; }

.snd { padding: 12px 0; border-top: 1px solid var(--line); }
.snd:first-of-type { border-top: 0; }
.snd .s-name { font-size: 22px; font-weight: 700; }
.snd .s-hint { color: var(--muted); font-size: 17px; margin-bottom: 8px; }
.snd .s-row { display: flex; gap: 8px; align-items: center; }
.snd .s-row select { flex: 1; }
.snd .s-file { color: var(--muted); font-size: 17px; margin-top: 6px; word-break: break-all; }

/* ---------- Entrenos guardados ---------- */
.saved-item { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 12px 16px; margin-bottom: 10px; }
.saved-item .si-name { font-weight: 800; font-style: italic; font-size: 26px; line-height: 1.05; }
.saved-item .si-sum { color: var(--muted); font-size: 21px; font-variant-numeric: tabular-nums; }
.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 22px 16px; text-align: center; color: var(--muted); font-size: 21px; margin-bottom: 14px; }

.toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 24px); transform: translateX(-50%); background: var(--chalk); color: var(--ink); padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 21px; z-index: 50; max-width: 90vw; text-align: center; }

/* ---------- Pantalla del reloj ---------- */
.run { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; max-width: none; padding-top: calc(var(--safe-t) + 10px); padding-bottom: calc(var(--safe-b) + 14px); }
.run .top { margin-bottom: 4px; }
.run .gym-logo { height: 44px; max-width: 140px; }
.run .gym-logo.round { width: 44px; }
.phase { text-align: center; font-weight: 800; font-style: italic; font-size: 40px; line-height: 1; min-height: 44px; color: var(--chalk); }
.run[data-type=rest] .phase { color: var(--rest); }
.run[data-type=prep] .phase { color: var(--orange); }
.run[data-type=done] .phase { color: var(--orange); }
.stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; min-width: 0; }
.bezel { background: #000; border: 2px solid #1c1c20; border-radius: 16px; padding: 18px 22px; box-shadow: inset 0 0 40px rgba(0,0,0,.9); }


.display { --u: 2px; display: flex; align-items: center; justify-content: center; gap: calc(40 * var(--u)); }
.led { display: flex; align-items: center; gap: calc(8 * var(--u)); transform: skewX(-7deg); }
.led svg { display: block; overflow: visible; }
.led-digit { width: calc(56 * var(--u)); height: calc(96 * var(--u)); }
.led-colon { width: calc(24 * var(--u)); height: calc(96 * var(--u)); }
.led-dot { width: calc(16 * var(--u)); height: calc(96 * var(--u)); }
.seg { fill: currentColor; opacity: 0.07; }
.seg.on { opacity: 1; }
#led-red { color: var(--red); filter: drop-shadow(0 0 calc(5 * var(--u)) rgba(255, 45, 45, .55)); }
#led-blue { color: var(--blue); filter: drop-shadow(0 0 calc(5 * var(--u)) rgba(58, 116, 255, .55)); }
.run[data-type=rest] #led-red { color: var(--rest); filter: drop-shadow(0 0 calc(5 * var(--u)) rgba(38, 224, 142, .5)); }
.run.paused #led-red { animation: blink 1s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: .35; } }
#led-blue { cursor: pointer; }


.rounds-bar { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 6px 0 12px; }
.rounds-bar .r-label { font-weight: 800; font-style: italic; font-size: 30px; color: var(--blue); min-width: 90px; text-align: center; }
.rounds-bar .btn { min-width: 84px; min-height: 76px; font-size: 44px; font-style: normal; }
.rounds-bar .btn.plus { min-width: 140px; background: var(--blue); border-color: var(--blue); color: #fff; }
.controls { display: grid; grid-template-columns: 1fr 1.6fr 1fr; gap: 10px; }
.controls .btn { min-height: 72px; }
.controls .main { font-size: 32px; }

@media (orientation: landscape) and (max-height: 560px) {
  .bezel { padding: 10px 18px; }
  .phase { font-size: 30px; min-height: 32px; }
  .rounds-bar { margin: 2px 0 8px; }
  .rounds-bar .btn { min-height: 56px; font-size: 36px; }
  .controls .btn { min-height: 56px; }
  .run .top { min-height: 48px; }
}

@media (prefers-reduced-motion: reduce) {
  .run.paused #led-red { animation: none; opacity: .5; }
  * { transition: none !important; }
}

.display[data-layout="col"] { flex-direction: column-reverse; gap: calc(26 * var(--u)); }

/* ---------- Predefinidos ---------- */
.preset { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
.p-name { font-weight: 800; font-style: italic; font-size: 28px; line-height: 1.05; }
.p-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font-size: 18px; font-variant-numeric: tabular-nums; }
.chip:first-child { color: var(--orange); border-color: #5a3a10; }
.p-desc { white-space: pre-line; color: #d6d6d9; font-size: 21px; line-height: 1.3; margin-bottom: 12px; user-select: text; -webkit-user-select: text; }
.p-actions { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
textarea.text-in { padding: 12px 14px; line-height: 1.3; resize: vertical; min-height: 140px; }

/* ---------- Contador de rondas ---------- */
.counter-ctl { display: grid; grid-template-columns: 1fr 2.2fr; gap: 10px; }
.counter-ctl .btn { min-height: 110px; font-size: 56px; font-style: normal; }
.counter-ctl .btn.plus { background: var(--blue); border-color: var(--blue); color: #fff; }
@media (orientation: landscape) and (max-height: 560px) { .counter-ctl .btn { min-height: 76px; font-size: 44px; } }

/* ---------- Ejercicios, info (i) y constructor ---------- */
.info-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; margin: -6px 0 -6px 2px; border-radius: 50%; color: var(--orange); vertical-align: middle; }
.info-btn svg { width: 24px; height: 24px; }
.info-btn:active { background: var(--panel-2); }
.ex-lines { list-style: none; margin: 0 0 12px; padding: 0; }
.ex-line { font-size: 22px; line-height: 1.35; padding: 3px 0; }
.ex-txt { font-size: 21px; color: var(--muted); padding: 3px 0; }
.ex-n { font-weight: 800; margin-right: 6px; }
.ex-q { font-weight: 800; color: var(--chalk); }
.ex-name { color: #e4e4e7; }
.ex-plus { color: var(--muted); }
.ex-note { color: var(--muted); font-style: italic; font-size: 19px; }
.ex-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 12px 16px; margin-bottom: 10px; }
.ex-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ex-actions { display: flex; gap: 6px; flex: none; }
.ex-actions .icon-btn { width: 44px; height: 44px; }
.ex-desc { margin: 6px 0 2px; color: #cfcfd3; font-size: 21px; line-height: 1.3; user-select: text; -webkit-user-select: text; }
.hint { color: var(--muted); font-size: 19px; margin: -4px 0 8px; }
.ed-line { border-top: 1px solid var(--line); padding: 12px 0; }
.ed-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.ed-title { font-weight: 800; font-style: italic; font-size: 22px; }
.ed-btns { display: flex; gap: 6px; }
.icon-btn.mini { width: 40px; height: 40px; border-radius: 12px; }
.icon-btn.mini svg { width: 22px; height: 22px; }
.icon-btn[disabled] { opacity: 0.3; pointer-events: none; }
.ed-part { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.ed-part .qty { flex: 0 0 34%; min-width: 0; }
.ed-part select { flex: 1; min-width: 0; }
.sheet-back { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: flex; align-items: flex-end; justify-content: center; z-index: 60; padding: 0 0 var(--safe-b); }
.sheet { background: var(--chalk); color: var(--ink); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 22px 20px 20px; max-height: 80dvh; overflow: auto; }
.sheet h2 { font-weight: 800; font-style: italic; font-size: 32px; line-height: 1.05; margin: 0 0 8px; }
.sheet p { font-size: 23px; line-height: 1.3; margin: 0 0 18px; user-select: text; -webkit-user-select: text; }
.sheet .btn:not(.primary):not(.danger) { color: var(--chalk); }
@media (orientation: landscape) { .sheet-back { align-items: center; } .sheet { border-radius: 22px; } }

/* ---------- Revisión: iconos sin recortes, botones del reloj que caben, ejercicios en pantalla ---------- */
svg { overflow: visible; }
.btn { white-space: nowrap; }
.controls { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.controls .main { grid-column: 1 / -1; order: -1; min-height: 76px; }
.controls .btn { min-height: 62px; padding: 0 10px; font-size: 24px; gap: 8px; }
.controls .btn svg { width: 24px; height: 24px; flex: none; }
@media (min-width: 640px) {
  .controls { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1fr); }
  .controls .main { grid-column: auto; order: 0; min-height: 72px; }
  .controls .btn { min-height: 72px; }
}
@media (orientation: landscape) and (max-height: 560px) { .controls .btn, .controls .main { min-height: 56px; } }

.run-body { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 8px; }
.run-body .stage { flex: 1 1 0; min-height: 0; }
.ex-panel { flex: 0 1 auto; max-height: 36%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 6px 10px; margin-bottom: 8px; }
.ex-panel .ex-lines { margin: 0; }
.run .ex-line { font-size: 26px; padding: 4px 8px; border-left: 5px solid transparent; border-radius: 6px; }
.run .ex-txt { font-size: 22px; padding: 2px 8px; }
.run .ex-line.now { color: var(--red); border-left-color: var(--red); background: rgba(255, 45, 45, 0.14); font-weight: 800; }
.run .ex-line.now .ex-name, .run .ex-line.now .ex-q, .run .ex-line.now .ex-n { color: var(--red); }
.run .ex-line.next { border-left-color: var(--orange); }
.run .ex-line.next .ex-name { color: var(--orange); }
@media (orientation: landscape) and (min-width: 640px) {
  .run-body { flex-direction: row; gap: 12px; }
  .ex-panel { flex: 0 0 40%; max-height: none; margin-bottom: 0; }
}
.error { background: #3a1010; border: 1px solid #8a2222; color: #ff9a9a; border-radius: 12px; padding: 10px 14px; font-size: 21px; margin: 0 0 14px; }
.error[hidden] { display: none; }

/* ---- compartir ---- */
.share-prev { display: flex; justify-content: center; margin-bottom: 12px; }
.share-prev canvas { display: block; width: auto; max-width: 100%; max-height: 52dvh; border-radius: 14px; border: 1px solid var(--line); background: #050506; }
.seg-ctl { display: flex; gap: 8px; margin-bottom: 10px; }
.seg-ctl .btn { flex: 1; }
.seg-ctl .btn.on { background: var(--orange); color: #1b1203; border-color: var(--orange); }
.share-photo { margin-bottom: 10px; flex-wrap: wrap; }
.share-photo .btn { cursor: pointer; }
.share-photo [hidden] { display: none; }
.chk { display: flex; align-items: center; gap: 10px; font-size: 22px; margin: 4px 0 12px; }
.chk input { width: 24px; height: 24px; accent-color: var(--orange); }

.card-form { margin-bottom: 12px; }
.fld { display: block; margin: 10px 0; }
.fld > span, .m-l, .photo-l { display: block; color: var(--muted); font-size: 19px; margin-bottom: 4px; }
.fld textarea { width: 100%; resize: vertical; font-family: inherit; }
.m-box { margin: 10px 0; }
.m-box[hidden], .photo-row [hidden] { display: none; }
.m-box .row .text-in { min-width: 0; }
.photo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.photo-row .photo-l { flex: 1 0 100%; margin: 0; }
.photo-row .btn { cursor: pointer; flex: 1; }

.mini-f { display: block; min-width: 0; }
.mini-f > span { display: block; color: var(--muted); font-size: 17px; margin-bottom: 3px; }
.mini-f .text-in { width: 100%; }

/* ---- revisión: el título de fase nunca se encoge ni se solapa con el marcador; cabecera a una línea ---- */
.phase { flex: 0 0 auto; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 4px; }
@media (max-width: 420px) { .phase { font-size: 32px; min-height: 36px; } }
.run .top .gymname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run .top .grow { min-width: 0; }
.run .top { flex: 0 0 auto; }

/* contador en horizontal: dígitos grandes a la izquierda, botones a la derecha */
@media (orientation: landscape) and (max-height: 520px) {
  .counter-screen { display: grid; grid-template-columns: 1fr minmax(180px, 34%); grid-template-rows: auto auto 1fr auto; column-gap: 12px; }
  .counter-screen .top { grid-column: 1 / -1; }
  .counter-screen .phase { grid-column: 1; grid-row: 2; }
  .counter-screen .stage { grid-column: 1; grid-row: 3 / 5; min-height: 0; }
  .counter-screen .counter-ctl { grid-column: 2; grid-row: 2 / 4; flex-direction: column; height: 100%; }
  .counter-screen .counter-ctl .btn { flex: 1; }
  .counter-screen #reset { grid-column: 2; grid-row: 4; margin-top: 0 !important; }
}

/* ---- historial ---- */
.hist-g { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; }
.hist-g > summary { list-style: none; cursor: pointer; padding: 12px 14px; }
.hist-g > summary::-webkit-details-marker { display: none; }
.h-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.h-name { font-weight: 800; font-style: italic; font-size: 26px; line-height: 1.1; }
.h-sub { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 20px; margin-top: 4px; flex-wrap: wrap; }
.h-pr { display: inline-flex; align-items: center; gap: 4px; color: var(--orange); font-weight: 700; }
.h-pr svg { width: 22px; height: 22px; }
.h-spark { margin-left: auto; color: var(--orange); }
.spark { width: 96px; height: 26px; display: block; }
.h-body { padding: 0 14px 12px; }
.h-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 21px; }
.h-date { color: var(--muted); min-width: 92px; }
.h-val { flex: 1; font-weight: 700; }
.pr-tag { background: var(--orange); color: #1b1203; border-radius: 6px; padding: 0 6px; font-size: 16px; margin-left: 4px; }
.h-d { font-weight: 700; font-size: 19px; }
.h-d.good { color: #4cd964; } .h-d.bad { color: #ff7b7b; } .h-d.same { color: var(--muted); }

.seg-ctl .btn { padding: 0 6px; }

/* ---------- Running ---------- */
.sec-h { font-weight: 800; font-style: italic; font-size: 26px; margin: 18px 0 8px; color: var(--orange); }
.muted { color: var(--muted); }
.err { background: rgba(255, 45, 45, .12); border: 1px solid #6b1a1a; color: #ff9a9a; border-radius: 14px; padding: 12px 14px; font-size: 21px; }
.preview { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
.pv-w { margin-top: 10px; } .pv-p { color: #d6d6d9; font-size: 20px; line-height: 1.3; }
.bigline { font-size: 30px; font-weight: 800; font-style: italic; margin: 6px 0; }
.wk { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; }
.wk-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.part { border-top: 1px solid var(--line); padding: 10px 0; }
.chip.done { color: var(--rest); border-color: #14573a; }
.stp { background: var(--panel-2); border-radius: 12px; padding: 8px; margin: 6px 0; }
.stp-r { display: flex; gap: 6px; align-items: flex-end; margin: 4px 0; }
.stp-r > * { flex: 1; min-width: 0; }
.stp-r .f-note { flex: 2; }
.bests, .splits { list-style: none; margin: 0 0 12px; padding: 0; }
.bests li, .splits li { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 22px; font-variant-numeric: tabular-nums; }
.splits li { grid-template-columns: 1fr auto; }
.splits li.fast b { color: var(--rest); }
.rr-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; text-align: center; }
.rr-n { display: block; font-weight: 800; font-style: italic; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.rr-l { color: var(--muted); font-size: 18px; }
.rr-route { width: 100%; max-height: 240px; color: var(--red); filter: drop-shadow(0 0 4px rgba(255, 45, 45, .6)); }
.pr-tag { background: #2fbf5b; color: #04200d; border-radius: 8px; padding: 0 8px; font-size: 18px; font-style: italic; }

/* carrera en vivo */
.gps-st { text-align: center; font-size: 19px; color: var(--muted); flex: 0 0 auto; }
.gps-st.good { color: var(--rest); } .gps-st.mid { color: var(--orange); } .gps-st.bad { color: #ff7b7b; }
.rg-body { display: flex; flex-direction: column; gap: 8px; }
.rg-leds { flex: 1 1 0; min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.rg-blk { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
.rg-blk .stage { flex: 1 1 0; }
.rg-l { position: absolute; left: 8px; top: 2px; z-index: 1; font-size: 16px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.rg-blk .bezel { padding: 8px 18px; }

<script>
/* ---- timer.js ---- */
/* 4TIMER — lógica pura de temporizadores (sin DOM, testeable en Node) */
(function (root) {
  'use strict';

  /* Definición de modos. Los tiempos se guardan en segundos. */
  var MODES = [
    {
      id: 'fortime', name: 'For Time',
      desc: 'Cronómetro hacia arriba. Termina el entreno lo más rápido posible.',
      manual: true,
      fields: [{ k: 'cap', type: 'time', label: 'Time cap (00:00 = sin límite)', def: 0 }]
    },
    {
      id: 'amrap', name: 'AMRAP',
      desc: 'Cuenta atrás. Haz tantas rondas como puedas y apúntalas en el contador.',
      manual: true,
      fields: [{ k: 'dur', type: 'time', label: 'Duración', def: 720 }]
    },
    {
      id: 'amrapx', name: 'AMRAP con descansos',
      desc: 'Varios bloques AMRAP con descanso entre ellos. Con contador de rondas.',
      manual: true,
      fields: [
        { k: 'dur', type: 'time', label: 'Duración de cada AMRAP', def: 600 },
        { k: 'blocks', type: 'num', label: 'Bloques', def: 2, min: 1, max: 10 },
        { k: 'rest', type: 'time', label: 'Descanso entre bloques', def: 60 }
      ]
    },
    {
      id: 'emom', name: 'EMOM',
      desc: 'Cada minuto en el minuto. Suena en cada cambio de intervalo.',
      fields: [
        { k: 'interval', type: 'time', label: 'Duración del intervalo', def: 60 },
        { k: 'rounds', type: 'num', label: 'Rondas', def: 10, min: 1, max: 99 }
      ]
    },
    {
      id: 'tabata', name: 'Tabata',
      desc: 'Trabajo y descanso en rondas. Clásico: 20 s / 10 s × 8.',
      fields: [
        { k: 'work', type: 'time', label: 'Trabajo', def: 20 },
        { k: 'rest', type: 'time', label: 'Descanso', def: 10 },
        { k: 'rounds', type: 'num', label: 'Rondas', def: 8, min: 1, max: 99 }
      ]
    },
    {
      id: 'interval', name: 'Intervalos',
      desc: 'Rondas con tiempos de trabajo y descanso a tu medida.',
      fields: [
        { k: 'work', type: 'time', label: 'Trabajo', def: 40 },
        { k: 'rest', type: 'time', label: 'Descanso', def: 20 },
        { k: 'rounds', type: 'num', label: 'Rondas', def: 8, min: 1, max: 99 }
      ]
    },
    {
      id: 'rest', name: 'Descanso',
      desc: 'Cuenta atrás para controlar el descanso entre series.',
      fields: [{ k: 'dur', type: 'time', label: 'Duración del descanso', def: 60 }]
    },
    {
      id: 'equal', name: 'Trabajo = descanso',
      desc: 'Descansas el mismo tiempo que has trabajado.',
      fields: [
        { k: 'work', type: 'time', label: 'Trabajo (y descanso)', def: 30 },
        { k: 'rounds', type: 'num', label: 'Rondas', def: 10, min: 1, max: 99 }
      ]
    },
    {
      id: 'counter', name: 'Contador de rondas',
      desc: 'Solo cuenta rondas, sin reloj. Para usar en cualquier entreno del box.',
      fields: []
    },
    {
      id: 'fgb', name: 'Fight Gone Bad',
      desc: 'Clásico: 5 estaciones de 1 min, 1 min de descanso, 3 rondas.',
      fields: [
        { k: 'rounds', type: 'num', label: 'Rondas', def: 3, min: 1, max: 20 },
        { k: 'stations', type: 'num', label: 'Estaciones por ronda', def: 5, min: 1, max: 20 },
        { k: 'work', type: 'time', label: 'Tiempo por estación', def: 60 },
        { k: 'rest', type: 'time', label: 'Descanso entre rondas', def: 60 }
      ]
    }
  ];

  var ORDER = ['fortime', 'emom', 'amrap', 'amrapx', 'tabata', 'interval', 'rest', 'equal', 'fgb', 'counter'];
  MODES.sort(function (a, b) { return ORDER.indexOf(a.id) - ORDER.indexOf(b.id); });

  function getMode(id) {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].id === id) return MODES[i];
    return null;
  }

  function defaultConfig(id) {
    var m = getMode(id), c = {};
    if (!m) return c;
    m.fields.forEach(function (f) { c[f.k] = f.def; });
    return c;
  }

  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  /* Texto corto con la configuración, para listas */
  function summary(id, c) {
    c = Object.assign(defaultConfig(id), c || {});
    switch (id) {
      case 'fortime': return c.cap ? 'Time cap ' + fmt(c.cap) : 'Sin time cap';
      case 'amrap': return fmt(c.dur) + ' min';
      case 'emom': return c.rounds + ' × ' + fmt(c.interval);
      case 'tabata':
      case 'interval': return c.rounds + ' × ' + fmt(c.work) + ' / ' + fmt(c.rest);
      case 'amrapx': return c.blocks + ' × ' + fmt(c.dur) + ' AMRAP / ' + fmt(c.rest);
      case 'rest': return fmt(c.dur);
      case 'equal': return c.rounds + ' × ' + fmt(c.work) + ' / ' + fmt(c.work);
      case 'fgb': return c.rounds + ' rondas × ' + c.stations + ' × ' + fmt(c.work);
      case 'counter': return 'Sin reloj';
    }
    return '';
  }

  /* Plan: lista de segmentos {dur, type, label, round}. */
  function buildPlan(id, cfg) {
    var c = Object.assign(defaultConfig(id), cfg || {});
    var segs = [], i, k;
    var plan = { mode: id, kind: 'segments', segments: segs, manual: false, cap: 0 };

    switch (id) {
      case 'fortime':
        plan.kind = 'up'; plan.manual = true; plan.cap = c.cap || 0;
        break;
      case 'amrap':
        plan.manual = true;
        segs.push({ dur: c.dur, type: 'work', label: 'AMRAP', round: 0 });
        break;
      case 'emom':
        for (i = 1; i <= c.rounds; i++) segs.push({ dur: c.interval, type: 'minute', label: 'EMOM', round: i });
        break;
      case 'tabata':
        for (i = 1; i <= c.rounds; i++) {
          segs.push({ dur: c.work, type: 'work', label: 'Trabajo', round: i });
          if (c.rest > 0) segs.push({ dur: c.rest, type: 'rest', label: 'Descanso', round: i });
        }
        break;
      case 'interval':
        for (i = 1; i <= c.rounds; i++) {
          segs.push({ dur: c.work, type: 'work', label: 'Trabajo', round: i });
          if (c.rest > 0 && i < c.rounds) segs.push({ dur: c.rest, type: 'rest', label: 'Descanso', round: i });
        }
        break;
      case 'equal':
        for (i = 1; i <= c.rounds; i++) {
          segs.push({ dur: c.work, type: 'work', label: 'Trabajo', round: i });
          if (i < c.rounds) segs.push({ dur: c.work, type: 'rest', label: 'Descanso', round: i });
        }
        break;
      case 'amrapx':
        plan.manual = true;
        for (i = 1; i <= c.blocks; i++) {
          segs.push({ dur: c.dur, type: 'work', label: 'AMRAP ' + i + '/' + c.blocks, round: i });
          if (c.rest > 0 && i < c.blocks) segs.push({ dur: c.rest, type: 'rest', label: 'Descanso', round: i });
        }
        break;
      case 'rest':
        segs.push({ dur: c.dur, type: 'rest', label: 'Descanso', round: 0 });
        break;
      case 'fgb':
        for (i = 1; i <= c.rounds; i++) {
          for (k = 1; k <= c.stations; k++) {
            segs.push({ dur: c.work, type: 'minute', label: 'Estación ' + k, round: i });
          }
          if (c.rest > 0 && i < c.rounds) segs.push({ dur: c.rest, type: 'rest', label: 'Descanso', round: i });
        }
        break;
      case 'counter':
        plan.kind = 'counter';
        break;
      default:
        throw new Error('Modo desconocido: ' + id);
    }
    plan.total = segs.reduce(function (a, s) { return a + s.dur; }, 0);
    return plan;
  }

  /* Línea de tiempo de sonidos: [{ev, ms}] ordenada, con ms desde el pulsar Empezar.
     Es lo que permite programar los pitidos por adelantado en el reloj de audio. */
  function timeline(plan, prepSec, opts) {
    opts = opts || {};
    var out = [], P = prepSec * 1000, r;
    for (r = Math.min(3, prepSec); r >= 1; r--) out.push({ ev: 'countdown', ms: P - r * 1000 });
    out.push({ ev: 'go', ms: P });
    if (plan.kind === 'up') {
      if (plan.cap) out.push({ ev: 'end', ms: P + plan.cap * 1000 });
    } else {
      var acc = P;
      plan.segments.forEach(function (sg, i) {
        if (i > 0) out.push({ ev: sg.type === 'minute' ? 'minute' : sg.type === 'rest' ? 'rest' : 'work', ms: acc });
        if (opts.beepLast3 && sg.dur > 3) for (r = 3; r >= 1; r--) out.push({ ev: 'countdown', ms: acc + (sg.dur - r) * 1000 });
        acc += sg.dur * 1000;
      });
      out.push({ ev: 'end', ms: acc });
    }
    return out.sort(function (a, b) { return a.ms - b.ms; });
  }

  /* Estado del reloj tras `ms` milisegundos desde el inicio (incluye la cuenta previa). */
  function stateAt(plan, prepSec, ms) {
    var prepMs = prepSec * 1000;
    if (ms < prepMs) {
      var rem = Math.ceil((prepMs - ms) / 1000);
      return { phase: 'prep', display: rem, remaining: rem, round: 0, segIndex: -1, type: 'prep', label: 'Preparados' };
    }
    var t = ms - prepMs;

    if (plan.kind === 'up') {
      if (plan.cap && t >= plan.cap * 1000) {
        return { phase: 'done', display: plan.cap, remaining: 0, round: 0, segIndex: 0, type: 'done', label: 'Fin' };
      }
      return { phase: 'run', display: Math.floor(t / 1000), remaining: null, round: 0, segIndex: 0, type: 'work', label: 'En marcha' };
    }

    var acc = 0, segs = plan.segments;
    for (var i = 0; i < segs.length; i++) {
      var end = acc + segs[i].dur * 1000;
      if (t < end) {
        var remaining = Math.ceil((end - t) / 1000);
        return { phase: 'run', display: remaining, remaining: remaining, round: segs[i].round, segIndex: i, type: segs[i].type, label: segs[i].label, segDur: segs[i].dur };
      }
      acc = end;
    }
    var last = segs.length ? segs[segs.length - 1] : { round: 0 };
    return { phase: 'done', display: 0, remaining: 0, round: last.round, segIndex: segs.length, type: 'done', label: 'Fin' };
  }

  /* Eventos de sonido a disparar al pasar del estado `prev` al estado `cur`. */
  function eventsFor(plan, prev, cur, opts) {
    var ev = [];
    opts = opts || {};
    if (!prev) prev = { phase: 'init' };

    if (cur.phase === 'prep') {
      if (cur.remaining > 0 && cur.remaining <= 3 && (prev.phase !== 'prep' || prev.remaining !== cur.remaining)) ev.push('countdown');
      return ev;
    }
    if (cur.phase === 'run') {
      if (prev.phase === 'init' || prev.phase === 'prep') {
        ev.push('go');
        return ev;
      }
      if (prev.phase === 'run') {
        if (cur.segIndex !== prev.segIndex) {
          if (cur.type === 'minute') ev.push('minute');
          else if (cur.type === 'rest') ev.push('rest');
          else ev.push('work');
        } else if (opts.beepLast3 && cur.remaining != null && cur.remaining >= 1 && cur.remaining <= 3 &&
                   prev.remaining !== cur.remaining && (cur.segDur || 0) > 3) {
          ev.push('countdown');
        }
      }
      return ev;
    }
    if (cur.phase === 'done' && prev.phase !== 'done') ev.push('end');
    return ev;
  }

  /* En EMOM, intervalos, tabata y trabajo=descanso cada ronda es un ejercicio de la lista:
     si hay menos rondas que ejercicios, el entreno no se puede hacer entero. Devuelve el texto del error o null. */
  var ROTATING = ['emom', 'interval', 'tabata', 'equal'];
  function exerciseCount(lines) { return (lines || []).filter(function (l) { return l.t === 'ex'; }).length; }
  function validateLines(modeId, cfg, lines) {
    var n = exerciseCount(lines);
    if (!n || ROTATING.indexOf(modeId) === -1) return null;
    var c = Object.assign(defaultConfig(modeId), cfg || {});
    if (c.rounds >= n) return null;
    var total = buildPlan(modeId, c).total;
    return 'El tiempo (' + fmt(total) + ') o las rondas (' + c.rounds + ') son inferiores al número de ejercicios (' + n + '). Sube las rondas o quita ejercicios.';
  }

  var api = {
    ROTATING: ROTATING, exerciseCount: exerciseCount, validateLines: validateLines,
    MODES: MODES, getMode: getMode, defaultConfig: defaultConfig, fmt: fmt, summary: summary,
    buildPlan: buildPlan, stateAt: stateAt, eventsFor: eventsFor, timeline: timeline
  };
  root.Timer = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

/* ---- exercises.js ---- */

      return { num: '', parts: [{ qty: s.partial ? (s.dist + ' m') : (s.km + ' km'), name: R.fmtTime(s.sec) }], note: '' };
    });
    return { modeName: 'RUNNING', name: h.name, kind: 'run', value: h.value, sub: h.sub, label: 'DISTANCIA', pr: h.pr, lines: lines, date: h.date || K().dateEs(h.ts), route: route };
  }
  function shareText(h) { return h.name + ' · ' + R.fmtKm(h.distance) + ' km · ' + R.fmtTime(h.sec) + (h.avgPace ? ' · ' + R.fmtPace(h.avgPace) + '/km' : '') + ' #4TIMER'; }
  function saveGPX(h) {
    if (!h.route || h.route.length < 2) { K().toast('Esta carrera no tiene recorrido'); return Promise.resolve(); }
    var name = '4timer-' + new Date(h.startT || h.ts || Date.now()).toISOString().slice(0, 10) + '.gpx';
    return root.Share.file(name, R.buildGPX(h), 'application/gpx+xml', 'Carrera 4TIMER').then(function (r) { if (r === 'saved') K().toast('Archivo GPX guardado'); });
  }

  function routeSvg(route) {
    if (!route || route.length < 2) return '';
    var kx = Math.cos(route[0][0] * Math.PI / 180), P = route.map(function (p) { return [p[1] * kx, -p[0]]; }), mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9;
    P.forEach(function (p) { mnx = Math.min(mnx, p[0]); mxx = Math.max(mxx, p[0]); mny = Math.min(mny, p[1]); mxy = Math.max(mxy, p[1]); });
    var W = 300, H = 200, m = 14, k = Math.min((W - 2 * m) / Math.max(1e-9, mxx - mnx), (H - 2 * m) / Math.max(1e-9, mxy - mny)), ox = (W - (mxx - mnx) * k) / 2, oy = (H - (mxy - mny) * k) / 2;
    var d = P.map(function (p) { return ((p[0] - mnx) * k + ox).toFixed(1) + ',' + ((p[1] - mny) * k + oy).toFixed(1); }).join(' ');
    return '<svg class="rr-route" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Recorrido dibujado"><polyline points="' + d + '" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }

  /* ---------- router ---------- */
  function route(parts, q) {
    var a = parts[0];
    if (!a) return hub();
    if (a === 'free') return live({ name: 'Carrera libre', steps: null, free: true });
    if (a === 'go') return goProgram(parts[1], +parts[2], +parts[3]);
    if (a === 'result') return result();
    if (a === 'program' && parts[1]) return viewProgram(parts[1]);
    if (a === 'part') return editPart(parts[1], +parts[2], +parts[3]);
    if (a === 'import-file') return importFile();
    if (a === 'import-prog') return importProg();
    hub();
  }

  /* ---------- inicio de Running ---------- */
  function hub() {

      '<button class="btn small block" data-nav="#/running/import-file" style="margin-bottom:12px">' + ICON.file + 'Importar carrera del reloj (GPX, TCX, FIT)</button>';
    var b = Store.runBests(), names = { 1000: '1 km', 5000: '5 km', 10000: '10 km', 21097: 'Media maratón' }, rows = Object.keys(names).filter(function (k) { return b[k]; });
    if (rows.length) {
      html += '<h2 class="sec-h">Mis mejores marcas</h2><ul class="bests">' + rows.map(function (k) { return '<li><span>' + names[k] + '</span><b>' + R.fmtTime(b[k].sec) + '</b><span class="muted">' + esc(K().dateEs(b[k].ts)) + '</span></li>'; }).join('') + '</ul>';
    }

    $('#new-prog').addEventListener('click', function () {

      var p = Store.saveProgram({ id: '', name: name.slice(0, 60), weeks: [newWeek(1)] });

  }
  function defStep() { return { t: 'step', kind: 'time', value: 300, level: 1, note: '' }; }
  function newWeek(n) { return { name: 'Semana ' + n, parts: [{ name: 'A', items: [defStep()] }] }; }

  /* ---------- un programa: semanas y partes ---------- */
  function partDone(pid, wi, pi) {
    var key = pid + '|' + wi + '|' + pi, h = root.Store.history().filter(function (x) { return x.modeId === 'run' && x.progKey === key; });
    return h.length ? h[h.length - 1] : null;
  }
  function viewProgram(id) {
    var Store = root.Store, ICON = K().ICON, p = Store.getProgram(id);
    if (!p) return K().go('#/running');
    var html = '<div class="screen">' + K().header(p.name, { back: '#/running' }) +
      '<div class="row" style="margin-bottom:12px"><button class="btn small" id="p-ren">' + ICON.edit + 'Renombrar</button><button class="btn small" id="p-exp">' + ICON.share + 'Exportar</button></div>';
    p.weeks.forEach(function (w, wi) {

        html += '<div class="part"><div class="wk-h"><span class="p-name" style="font-size:24px">' + esc(pt.name) + '</span>' + (d ? '<span class="chip done">✓ ' + esc(K().dateEs(d.ts)) + '</span>' : '') + '</div>' +
          '<ul class="ex-lines">' + pt.items.map(function (it) { return '<li class="ex-line">' + esc(R.describeItem(it)) + '</li>'; }).join('') + '</ul>' +
          '<div class="p-actions"><button class="btn primary small" data-go="' + wi + '.' + pi + '">' + ICON.play + 'Empezar</button>' +
          '<button class="icon-btn mini" data-ped="' + wi + '.' + pi + '" aria-label="Editar parte">' + ICON.edit + '</button></div></div>';
      });
      html += '<button class="btn small block" data-padd="' + wi + '" style="margin-top:6px">' + ICON.plus + 'Añadir parte</button></section>';
    });
    html += '<button class="btn small block" id="w-add" style="margin:8px 0">' + ICON.plus + 'Añadir semana</button>' +
      '<button class="btn small block danger" id="p-del">' + ICON.trash + 'Borrar programa</button></div>';
    app().innerHTML = html;
    function persist(msg) { var e = R.validateProgram(p); if (e) { K().toast(e); return false; } Store.saveProgram(p); viewProgram(id); if (msg) K().toast(msg); return true; }
    function onClick(e) {
      var t = e.target, b;
      if ((b = t.closest('[data-go]'))) { var g = b.dataset.go.split('.'); root.Sound && root.Sound.unlock(); K().go('#/running/go/' + id + '/' + g[0] + '/' + g[1]); }

      else if ((b = t.closest('[data-wren]'))) { var n = (window.prompt('Nombre de la semana', p.weeks[+b.dataset.wren].name) || '').trim(); if (n) { p.weeks[+b.dataset.wren].name = n.slice(0, 40); persist(); } }

      else if (t.closest('#w-add')) { if (p.weeks.length >= 52) return; p.weeks.push(newWeek(p.weeks.length + 1)); persist(); }
      else if (t.closest('#p-ren')) { var nn = (window.prompt('Nombre del programa', p.name) || '').trim(); if (nn) { p.name = nn.slice(0, 60); persist(); } }
      else if (t.closest('#p-del')) { if (window.confirm('¿Borrar el programa «' + p.name + '»?')) { Store.removeProgram(id); K().go('#/running'); } }
      else if (t.closest('#p-exp')) exportDialog(p);
    }
    app().addEventListener('click', onClick);
    K().setCleanup(function () { app().removeEventListener('click', onClick); });
  }

  function exportDialog(p) {
    var ICON = K().ICON, text = R.exportProgram(p), safe = p.name.replace(/[^\w\-]+/g, '_').slice(0, 30) || 'programa';
    var back = document.createElement('div');

      '<textarea class="text-in" id="exp-text" readonly rows="4"></textarea>' +

      '<button class="btn small block" id="exp-share" style="margin-top:8px">' + ICON.share + 'Enviar…</button><button class="btn small block" id="exp-close" style="margin-top:8px">Cerrar</button></div>';

        else root.Share.file(safe + '.4timer.json', text, 'application/json', p.name).then(function (r) { if (r === 'saved') K().toast('Archivo guardado'); });
      }
    });
  }

  /* ---------- editor de una parte ---------- */
  function stepRow(s, path) {
    var time = s.kind === 'time', m = Math.floor(s.value / 60), sec = s.value % 60, km = s.value >= 1000 && s.value % 1000 === 0;
    return '<div class="stp" data-path="' + path + '"><div class="stp-r">' +
      '<select class="text-in f-kind" aria-label="Tipo"><option value="time"' + (time ? ' selected' : '') + '>Tiempo</option><option value="dist"' + (!time ? ' selected' : '') + '>Distancia</option></select>' +
      (time ? '<label class="mini-f"><span>Min</span><input class="text-in f-min" type="number" inputmode="numeric" min="0" max="480" value="' + m + '"></label><label class="mini-f"><span>Seg</span><input class="text-in f-sec" type="number" inputmode="numeric" min="0" max="59" value="' + sec + '"></label>'
        : '<label class="mini-f"><span>' + (km ? 'Km' : 'Metros') + '</span><input class="text-in f-dist" type="number" inputmode="decimal" min="0" step="any" value="' + (km ? s.value / 1000 : s.value) + '"></label><select class="text-in f-unit" aria-label="Unidad"><option value="m"' + (km ? '' : ' selected') + '>m</option><option value="km"' + (km ? ' selected' : '') + '>km</option></select>') +
      '</div><div class="stp-r"><select class="text-in f-lvl" aria-label="Intensidad">' + lvlOptions(s.level) + '</select>' +
      '<input class="text-in f-note" maxlength="40" placeholder="Nota (ej. 3/10, 50 %)" value="' + esc(s.note || '') + '"></div></div>';
  }
  function editPart(pid, wi, pi) {
    var Store = root.Store, ICON = K().ICON, prog = Store.getProgram(pid);
    if (!prog || !prog.weeks[wi] || !prog.weeks[wi].parts[pi]) return K().go('#/running');
    var part = JSON.parse(JSON.stringify(prog.weeks[wi].parts[pi]));
    function render() {
      var html = '<div class="screen">' + K().header('Editar parte', { back: '#/running/program/' + pid }) +
        '<p class="lead">' + esc(prog.name) + ' · ' + esc(prog.weeks[wi].name) + '</p>' +
        '<label class="fld"><span>Nombre de la parte</span><input class="text-in" id="pt-name" maxlength="40" value="' + esc(part.name) + '"></label>';
      part.items.forEach(function (it, i) {
        html += '<div class="ed-line"><div class="ed-head"><span class="ed-title">' + (it.t === 'repeat' ? 'Bloque repetido' : 'Paso ' + (i + 1)) + '</span><div class="ed-btns">' +
          '<button class="icon-btn mini" data-up="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Subir">' + ICON.up + '</button>' +
          '<button class="icon-btn mini" data-down="' + i + '"' + (i === part.items.length - 1 ? ' disabled' : '') + ' aria-label="Bajar">' + ICON.down + '</button>' +
          '<button class="icon-btn mini" data-del="' + i + '" aria-label="Borrar">' + ICON.trash + '</button></div></div>';
        if (it.t === 'repeat') {
          html += '<label class="fld"><span>Número de rondas</span><input class="text-in f-rounds" data-path="' + i + '" type="number" inputmode="numeric" min="1" max="99" value="' + it.rounds + '"></label>';
          it.steps.forEach(function (s, j) {
            html += stepRow(s, i + '.' + j) + '<div class="ed-btns" style="justify-content:flex-end"><button class="icon-btn mini" data-sdel="' + i + '.' + j + '" aria-label="Borrar paso del bloque">' + ICON.trash + '</button></div>';
          });
          html += '<button class="btn small block" data-sadd="' + i + '">' + ICON.plus + 'Añadir paso al bloque</button>';
        } else html += stepRow(it, String(i));
        html += '</div>';
      });
      html += '<div class="row" style="margin:12px 0"><button class="btn small" id="add-step">' + ICON.plus + 'Añadir paso</button><button class="btn small" id="add-rep">' + ICON.plus + 'Añadir bloque</button></div>' +
        '<p class="hint">Ejemplo: 5 rondas sin descanso = bloque con 3 pasos (3\' suave 50 %, 2\' medio 70 %, 1\' sprint 100 %).</p>' +
        '<button class="btn primary block" id="pt-save">Guardar parte</button></div>';
      app().innerHTML = html;
    }
    function stepAt(path) { var a = String(path).split('.'); return a.length === 1 ? part.items[+a[0]] : part.items[+a[0]].steps[+a[1]]; }
    function read() {
      part.name = ($('#pt-name').value || '').trim();
      $$('.f-rounds').forEach(function (el) { part.items[+el.dataset.path].rounds = parseInt(el.value, 10) || 0; });
      $$('.stp').forEach(function (el) {
        var s = stepAt(el.dataset.path), q = function (c) { return el.querySelector(c); };
        s.kind = q('.f-kind').value; s.level = +q('.f-lvl').value; s.note = (q('.f-note').value || '').trim();
        if (s.kind === 'time') s.value = (parseInt(q('.f-min').value, 10) || 0) * 60 + (parseInt(q('.f-sec').value, 10) || 0);
        else s.value = Math.round((parseFloat(String(q('.f-dist').value).replace(',', '.')) || 0) * (q('.f-unit').value === 'km' ? 1000 : 1));
      });
    }
    function onClick(e) {
      var t = e.target, b;
      if (t.closest('#pt-save')) {
        read();
        var copy = JSON.parse(JSON.stringify(prog)); copy.weeks[wi].parts[pi] = part;
        var err = R.validateProgram(copy); if (err) return K().toast(err);
        Store.saveProgram(copy); K().toast('Parte guardada'); return K().go('#/running/program/' + pid);
      }
      if (t.closest('#add-step')) { read(); if (part.items.length >= 60) return; part.items.push(defStep()); return render(); }
      if (t.closest('#add-rep')) { read(); if (part.items.length >= 60) return; part.items.push({ t: 'repeat', rounds: 3, steps: [defStep()] }); return render(); }
      if ((b = t.closest('[data-up]'))) { read(); var i = +b.dataset.up; part.items.splice(i - 1, 0, part.items.splice(i, 1)[0]); return render(); }
      if ((b = t.closest('[data-down]'))) { read(); var k = +b.dataset.down; part.items.splice(k + 1, 0, part.items.splice(k, 1)[0]); return render(); }
      if ((b = t.closest('[data-del]'))) { read(); if (part.items.length < 2) return K().toast('La parte necesita al menos un paso'); part.items.splice(+b.dataset.del, 1); return render(); }
      if ((b = t.closest('[data-sadd]'))) { read(); var bl = part.items[+b.dataset.sadd]; if (bl.steps.length >= 12) return K().toast('Máximo 12 pasos por bloque'); bl.steps.push(defStep()); return render(); }
      if ((b = t.closest('[data-sdel]'))) { read(); var a = b.dataset.sdel.split('.'), blk = part.items[+a[0]]; if (blk.steps.length < 2) return K().toast('El bloque necesita al menos un paso'); blk.steps.splice(+a[1], 1); return render(); }
    }
    function onChange(e) { if (e.target.classList.contains('f-kind')) { read(); var s = stepAt(e.target.closest('.stp').dataset.path); s.value = s.kind === 'time' ? 300 : 1000; render(); } }
    render();
    app().addEventListener('click', onClick); app().addEventListener('change', onChange);
    K().setCleanup(function () { app().removeEventListener('click', onClick); app().removeEventListener('change', onChange); });
  }

  /* ---------- importar programa (archivo o texto pegado) ---------- */
  function importProg() {
    var Store = root.Store, ICON = K().ICON, found = null;
    app().innerHTML = '<div class="screen">' + K().header('Importar programa', { back: '#/running' }) +
      '<p class="lead">Pega el texto que te ha enviado tu entrenador o elige el archivo. Antes de guardar se comprueba que todo esté bien.</p>' +
      '<label class="btn block" style="margin-bottom:10px">' + ICON.file + 'Elegir archivo<input type="file" id="ip-file" accept=".json,.txt,.4timer,application/json,text/plain" hidden></label>' +
      '<label class="fld"><span>O pega aquí el texto del programa</span><textarea class="text-in" id="ip-text" rows="5" spellcheck="false"></textarea></label>' +
      '<button class="btn block" id="ip-check">Revisar programa</button><div id="ip-out" style="margin-top:12px"></div></div>';
    function check(text) {
      var out = $('#ip-out'); found = null;
      var r = R.parseProgramText(text);
      if (r.error) { out.innerHTML = '<div class="err" role="alert">' + esc(r.error) + '</div>'; return; }
      found = r.program;
      var already = Store.programs().some(function (p) { return p.name === found.name; });
      out.innerHTML = '<div class="preview"><div class="p-name">' + esc(found.name) + '</div>' +
        found.weeks.map(function (w) { return '<div class="pv-w"><b>' + esc(w.name) + '</b>' + w.parts.map(function (pt) { return '<div class="pv-p">' + esc(pt.name) + ': ' + esc(pt.items.map(R.describeItem).join(' + ')) + '</div>'; }).join('') + '</div>'; }).join('') + '</div>' +
        (already ? '<p class="hint">Ya tienes un programa con este nombre. Se guardará como otro programa distinto.</p>' : '') +
        '<button class="btn primary block" id="ip-save">Guardar programa</button>';
    }
    function onClick(e) {
      if (e.target.closest('#ip-check')) check($('#ip-text').value);
      else if (e.target.closest('#ip-save') && found) { var p = Store.saveProgram(found); K().toast('Programa importado'); K().go('#/running/program/' + p.id); }
    }
    function onFile(e) {
      var f = e.target.files[0]; if (!f) return;
      if (f.size > 400 * 1024) { $('#ip-out').innerHTML = '<div class="err" role="alert">El archivo es demasiado grande para ser un programa.</div>'; return; }
      var fr = new FileReader(); fr.onload = function () { $('#ip-text').value = fr.result; check(fr.result); };
      fr.onerror = function () { $('#ip-out').innerHTML = '<div class="err" role="alert">No se pudo leer el archivo.</div>'; };
      fr.readAsText(f); e.target.value = '';
    }
    app().addEventListener('click', onClick); $('#ip-file').addEventListener('change', onFile);
    K().setCleanup(function () { app().removeEventListener('click', onClick); });
  }

  /* ---------- importar carrera grabada por el reloj ---------- */
  function importFile() {
    var Store = root.Store, ICON = K().ICON, sum = null, fname = '';
    app().innerHTML = '<div class="screen">' + K().header('Importar carrera', { back: '#/running' }) +
      '<p class="lead">Exporta la carrera desde la app de tu pulsera (Zepp, Mi Fitness…) como GPX, TCX o FIT y elígela aquí. Solo se usa el recorrido y la hora.</p>' +
      '<label class="btn block" style="margin-bottom:10px">' + ICON.file + 'Elegir archivo<input type="file" id="if-file" accept=".gpx,.tcx,.fit,application/gpx+xml,application/octet-stream,text/xml" hidden></label><div id="if-out"></div></div>';

  function esc(s) {

  function dateEs(ts) { var m = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'], d = ts ? new Date(ts) : new Date(); return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear(); }

  var toastTimer;
  function toast(msg) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.remove(); }, 2600);
  }

    if (qi > -1) { h.slice(qi + 1).split('&').forEach(function (p) { var kv = p.split('='); q[kv[0]] = decodeURIComponent(kv[1] || ''); }); h = h.slice(0, qi); }
    var parts = h.split('/').filter(Boolean);
    return { parts: parts, q: q };
  }
  function render() {
    runGuard = null;
    if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
    closeInfo();
    var r = route(), p = r.parts;
    window.scrollTo(0, 0);
    if (!p.length) return viewHome();
    if (p[0] === 'config' && T.getMode(p[1])) return viewConfig(p[1]);
    if (p[0] === 'presets') return viewPresets(p[1]);
    if (p[0] === 'preset' && p[1]) return viewPresetForm(p[1]);
    if (p[0] === 'running') return window.RunUI.route(p.slice(1), r.q);
    if (p[0] === 'run') return viewRun();
    if (p[0] === 'share') return viewShare(p[1] === 'new');
    if (p[0] === 'history') return viewHistory();
    if (p[0] === 'exercises') return viewExercises();
    if (p[0] === 'exercise' && p[1]) return viewExerciseForm(p[1]);
    if (p[0] === 'settings') return viewSettings();
    viewHome();
  }
  window.addEventListener('hashchange', function () {
    if (runGuard && location.hash !== guardHash) {          // atrás (botón o gesto) con un entreno en marcha: se vuelve al entreno y se pregunta
      var target = location.hash;
      history.pushState(null, '', guardHash);                // sin disparar hashchange: la vista del entreno sigue intacta
      runGuard(target); return;
    }
    render();
  });

  function header(title, opts) {
    opts = opts || {};
    return '<div class="top">' +
      '<button class="icon-btn" data-nav="' + (opts.back || '#/') + '" aria-label="Volver">' + ICON.back + '</button>' +
      '<h1 class="title grow">' + esc(title) + '</h1></div>';
  }
  document.addEventListener('click', function (e) {
    var n = e.target.closest('[data-nav]');
    if (n) go(n.getAttribute('data-nav'));
  });

  /* ---------- Inicio ---------- */
  function viewHome() {
    var s = Store.settings();
    var html = '<div class="screen">' +
      '<div class="top"><div class="grow"><div class="wordmark"><span class="four">4</span>TIMER</div>' +
      (s.gymName ? '<div class="gymname">' + esc(s.gymName) + '</div>' : '') + '</div>' +
      '<img class="gym-logo' + logoCls() + '" src="' + esc(logoSrc()) + '" alt="' + esc(s.gymName || 'Logo del gimnasio') + '">' +
      '<button class="icon-btn" data-nav="#/settings" aria-label="Ajustes">' + ICON.gear + '</button></div>' +
      '<p class="sr-only">Elige el tipo de entrenamiento</p><ul class="modes">';
    function modeCard(m) {
      return '<li><button class="card" data-nav="#/config/' + m.id + '"><span>' + ICON[m.id] + '</span><span><span class="c-title">' + esc(m.name) + '</span><span class="c-desc">' + esc(m.desc) + '</span></span></button></li>';
    }
    html += '<li><button class="card accent" data-nav="#/presets"><span>' + ICON.presets + '</span><span><span class="c-title">Entrenamientos predefinidos</span><span class="c-desc">Los entrenos del box con el tiempo ya configurado. Toca y empieza, o crea el tuyo.</span></span></button></li>';
    var sess = Store.session();
    if (sess && !T.getMode(sess.pending.mode)) { Store.clearSession(); sess = null; }
    if (sess) html += '<li><button class="card accent" id="resume-btn"><span>' + ICON.play + '</span><span><span class="c-title">Retomar entreno</span><span class="c-desc">' + esc(sess.pending.name) + ' · pausado en ' + T.fmt(Math.floor(sess.elapsed / 1000)) + '</span></span></button>' +
      '<button class="btn small block" id="resume-del" style="margin-top:6px">Descartar el entreno guardado</button></li>';
    T.MODES.forEach(function (m) {
      if (m.id === 'counter') html += '<li><button class="card" data-nav="#/running"><span>' + ICON.run + '</span><span><span class="c-title">Running</span><span class="c-desc">Carrera con GPS: tiempo, km, ritmo y recorrido. Series y programas por semanas.</span></span></button></li>';
      html += modeCard(m);
    });
    html += '<li><button class="card" data-nav="#/exercises"><span>' + ICON.exercises + '</span><span><span class="c-title">Ejercicios</span><span class="c-desc">Todos los ejercicios guardados y qué es cada uno.</span></span></button></li>';
    html += '<li><button class="card" data-nav="#/history"><span>' + ICON.history + '</span><span><span class="c-title">Historial</span><span class="c-desc">Tus resultados y marcas personales. Repite un entreno y compara.</span></span></button></li>';
    html += '<li><button class="card" data-nav="#/share/new"><span>' + ICON.share + '</span><span><span class="c-title">Compartir entreno</span><span class="c-desc">Crea la imagen de un entreno hecho con el reloj y la pizarra de clase: resultado, texto y fotos.</span></span></button></li>';
    app.innerHTML = html + '</ul></div>';
    if (sess) {
      $('#resume-btn').addEventListener('click', function () {
        pending = sess.pending; resume = { elapsed: sess.elapsed, rounds: sess.rounds || 0 };
        Store.clearSession(); Sound.unlock(); go('#/run');
      });
      $('#resume-del').addEventListener('click', function () { if (window.confirm('¿Descartar el entreno guardado?')) { Store.clearSession(); viewHome(); } });
    }
  }

  /* ---------- Campos de configuración (compartidos por Config y Predefinidos) ---------- */
  function minSec(f) { return f.k === 'cap' || f.k === 'rest' ? 0 : 1; }
  function fieldHtml(f) {
    if (f.type === 'num') {
      return '<div class="field"><div class="flabel">' + esc(f.label) + '</div><div class="time-ctl"><div class="step">' +
        '<button data-f="' + f.k + '" data-d="-1" aria-label="Menos">−</button><output id="o-' + f.k + '"></output>' +
        '<button data-f="' + f.k + '" data-d="1" aria-label="Más">+</button></div></div></div>';
    }
    return '<div class="field"><div class="flabel">' + esc(f.label) + '</div><div class="time-ctl">' +
      '<div class="step"><button data-f="' + f.k + '" data-p="m" data-d="-1" aria-label="Menos minutos">−</button><output id="o-' + f.k + '-m"></output><button data-f="' + f.k + '" data-p="m" data-d="1" aria-label="Más minutos">+</button><span class="unit">min</span></div>' +
      '<div class="step"><button data-f="' + f.k + '" data-p="s" data-d="-1" aria-label="Menos segundos">−</button><output id="o-' + f.k + '-s"></output><button data-f="' + f.k + '" data-p="s" data-d="1" aria-label="Más segundos">+</button><span class="unit">s</span></div></div></div>';
  }
  function fieldsHtml(mode) { return mode.fields.map(fieldHtml).join(''); }
  function refreshFields(mode, cfg) {
    mode.fields.forEach(function (f) {
      if (f.type === 'num') { $('#o-' + f.k).textContent = cfg[f.k]; }
      else { $('#o-' + f.k + '-m').textContent = pad(Math.floor(cfg[f.k] / 60)); $('#o-' + f.k + '-s').textContent = pad(cfg[f.k] % 60); }
    });
  }
  function totalHtml(modeId, cfg) {
    if (modeId === 'fortime') return cfg.cap ? 'Time cap: <b>' + T.fmt(cfg.cap) + '</b>' : 'Sin time cap: el reloj cuenta hacia arriba';
    return 'Duración total: <b>' + T.fmt(T.buildPlan(modeId, cfg).total) + '</b>';
  }
  /* Aplica un clic en un botón −/+ al valor de cfg. Devuelve true si lo era. */
  function stepField(mode, cfg, target) {
    var b = target.closest('[data-f]');
    if (!b) return false;
    var f = mode.fields.filter(function (x) { return x.k === b.dataset.f; })[0], d = +b.dataset.d;
    if (!f) return false;
    if (f.type === 'num') {
      cfg[f.k] = Math.max(f.min, Math.min(f.max, cfg[f.k] + d));
    } else {
      var m = Math.floor(cfg[f.k] / 60), sec = cfg[f.k] % 60;
      if (b.dataset.p === 'm') m = Math.max(0, Math.min(99, m + d));
      else sec = Math.max(0, Math.min(55, sec + d * 5));
      cfg[f.k] = Math.max(minSec(f), m * 60 + sec);
    }
    return true;
  }

  /* ---------- Configuración de un modo ---------- */
  function viewConfig(modeId) {
    var mode = T.getMode(modeId);
    if (modeId === 'counter') {
      pending = { mode: modeId, cfg: {}, name: mode.name }; Sound.unlock(); return go('#/run');
    }
    var cfg = Store.config(modeId);

    app.innerHTML = '<div class="screen">' + header(mode.name) +
      '<p class="lead">' + esc(mode.desc) + '</p>' +
      '<div class="panel">' + fieldsHtml(mode) + '</div>' +
      '<div class="total" id="total"></div>' +
      '<button class="btn primary block" id="start">' + ICON.play + 'Empezar</button></div>';

    function refresh() { refreshFields(mode, cfg); $('#total').innerHTML = totalHtml(modeId, cfg); }
    refresh();

    function onStep(e) { if (stepField(mode, cfg, e.target)) refresh(); }
    app.addEventListener('click', onStep);
    cleanup = function () { app.removeEventListener('click', onStep); };
    $('#start').addEventListener('click', function () {
      Store.setConfig(modeId, cfg);
      pending = { mode: modeId, cfg: Object.assign({}, cfg), name: mode.name };
      Sound.unlock();
      go('#/run');
    });
  }

  /* ---------- Ficha de información de un ejercicio (i) ---------- */
  var sheetEl = null, sheetKey = null;
  function closeInfo() {
    if (sheetEl) { sheetEl.remove(); sheetEl = null; }
    if (sheetKey) { document.removeEventListener('keydown', sheetKey); sheetKey = null; }
  }
  function showInfo(id) {
    var e = Store.getExercise(id);
    if (!e) return;
    closeInfo();
    sheetEl = document.createElement('div');
    sheetEl.className = 'sheet-back';
    sheetEl.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><h2 id="sh-t">' + esc(e.name) + '</h2>' +
      '<p>' + (e.desc ? esc(e.desc) : 'Todavía no tiene explicación. Puedes añadirla en Ejercicios.') + '</p>' +
      '<button class="btn primary block" data-close>Entendido</button></div>';
    document.body.appendChild(sheetEl);
    sheetEl.addEventListener('click', function (ev) { if (ev.target === sheetEl || ev.target.closest('[data-close]')) closeInfo(); });
    sheetKey = function (ev) { if (ev.key === 'Escape') closeInfo(); };
    document.addEventListener('keydown', sheetKey);
    var btn = sheetEl.querySelector('[data-close]'); if (btn) btn.focus();
  }
  document.addEventListener('click', function (e) {
    var i = e.target.closest('[data-info]');
    if (i) { e.preventDefault(); showInfo(i.getAttribute('data-info')); }
  });

  function exName(id) { var e = Store.getExercise(id); return e ? e.name : '(ejercicio borrado)'; }
  function infoBtn(id) {
    if (!Store.getExercise(id)) return '';
    return '<button class="info-btn" data-info="' + esc(id) + '" aria-label="Qué es ' + esc(exName(id)) + '">' + ICON.info + '</button>';
  }
  /* Lista de ejercicios de un entreno, cada uno con su (i) */
  function linesHtml(pr) {
    var n = 0, h = '<ul class="ex-lines">';
    pr.lines.forEach(function (l) {
      if (l.t === 'txt') { h += '<li class="ex-txt">' + esc(l.text) + '</li>'; return; }
      n++;
      h += '<li class="ex-line" data-ei="' + (n - 1) + '">' + (pr.numbered ? '<span class="ex-n">' + n + '.</span>' : '') +
        l.parts.map(function (pt) {
          return '<span class="ex-part">' + (pt.qty ? '<b class="ex-q">' + esc(pt.qty) + '</b> ' : '') +
            '<span class="ex-name">' + esc(exName(pt.ex)) + '</span>' + infoBtn(pt.ex) + '</span>';
        }).join('<span class="ex-plus"> + </span>') +
        (l.note ? ' <span class="ex-note">' + esc(l.note) + '</span>' : '') + '</li>';
    });
    return h + '</ul>';
  }

  /* ---------- Entrenamientos predefinidos ---------- */
  var CATS = [
    { id: 'emom', name: 'EMOM', desc: 'Un ejercicio cada minuto' },
    { id: 'amrap', name: 'AMRAP', desc: 'Máximas rondas en un tiempo' },
    { id: 'fortime', name: 'For Time', desc: 'Completar el trabajo lo más rápido posible' },
    { id: 'partners', name: 'Partners', desc: 'Entrenos por parejas' },
    { id: 'otros', name: 'Otros', desc: 'Tabata, intervalos y demás' }
  ];
  function catOf(it) {
    if (/partner|pareja/i.test(it.name)) return 'partners';
    if (it.mode === 'emom') return 'emom';
    if (it.mode === 'amrap' || it.mode === 'amrapx') return 'amrap';
    if (it.mode === 'fortime') return 'fortime';
    return 'otros';
  }
  function viewPresets(cat) {
    var all = Store.presets(), html;
    var info = CATS.filter(function (c) { return c.id === cat; })[0];
    if (!info) {      // lista de categorías
      html = '<div class="screen">' + header('Entrenamientos predefinidos') +
        '<p class="lead">Elige el tipo de entrenamiento para ver su lista.</p>' +
        '<button class="btn primary block" data-nav="#/preset/new" style="margin-bottom:14px">' + ICON.plus + 'Crear entrenamiento</button><ul class="modes">';
      CATS.forEach(function (c) {
        var n = all.filter(function (it) { return catOf(it) === c.id; }).length;
        if (!n && c.id === 'otros') return;
        html += '<li><button class="card" data-nav="#/presets/' + c.id + '"><span>' + (ICON[c.id] || ICON.presets) + '</span><span><span class="c-title">' + esc(c.name) + '</span><span class="c-desc">' + esc(c.desc) + ' · ' + n + (n === 1 ? ' entreno' : ' entrenos') + '</span></span></button></li>';
      });
      html += '</ul><button class="btn small block" id="restore" style="margin-top:10px">Restaurar ejemplos borrados</button></div>';
    } else {
      var items = all.filter(function (it) { return catOf(it) === cat; });
      html = '<div class="screen">' + header(info.name, { back: '#/presets' }) +
        '<p class="lead">Toca Empezar y el reloj arranca. Con (i) ves qué es cada ejercicio.</p>' +
        '<button class="btn primary block" data-nav="#/preset/new" style="margin-bottom:14px">' + ICON.plus + 'Crear entrenamiento</button>';
      if (!items.length) html += '<div class="empty">No hay entrenos en esta lista.</div>';
      items.forEach(function (it) {
        var m = T.getMode(it.mode);
        html += '<article class="preset"><div class="p-name">' + esc(it.name) + '</div>' +
          '<div class="p-tags"><span class="chip">' + esc(m ? m.name : it.mode) + '</span><span class="chip">' + esc(T.summary(it.mode, it.cfg)) + '</span></div>' +
          (it.lines.length ? linesHtml(it) : '') +
          '<div class="p-actions"><button class="btn primary small" data-prun="' + it.id + '">' + ICON.play + 'Empezar</button>' +
          '<button class="icon-btn" data-nav="#/preset/' + it.id + '" aria-label="Editar ' + esc(it.name) + '">' + ICON.edit + '</button>' +
          '<button class="icon-btn" data-pdel="' + it.id + '" aria-label="Borrar ' + esc(it.name) + '">' + ICON.trash + '</button></div></article>';
      });
      html += '</div>';
    }
    app.innerHTML = html;

    function onClick(e) {
      var r = e.target.closest('[data-prun]'), d = e.target.closest('[data-pdel]');
      if (r) {
        var it = Store.getPreset(r.dataset.prun);
        if (!it) return;
        var err = T.validateLines(it.mode, it.cfg, it.lines);
        if (err) { toast('Error: ' + err); return; }
        pending = { mode: it.mode, cfg: Object.assign(T.defaultConfig(it.mode), it.cfg), name: it.name, lines: it.lines, numbered: !!it.numbered, presetId: it.id };
        Sound.unlock(); go('#/run');
      } else if (d) {
        var item = Store.getPreset(d.dataset.pdel);
        if (item && window.confirm('¿Borrar "' + item.name + '"?')) { Store.removePreset(item.id); viewPresets(cat); toast('Entreno borrado'); }
      } else if (e.target.closest('#restore')) {
        var n = Store.restorePresets(); viewPresets(cat); toast(n ? 'Ejemplos restaurados: ' + n : 'No faltaba ningún ejemplo');
      }
    }
    app.addEventListener('click', onClick);
    cleanup = function () { app.removeEventListener('click', onClick); };
  }

  function viewPresetForm(id) {
    var editing = id !== 'new' ? Store.getPreset(id) : null;
    if (id !== 'new' && !editing) return go('#/presets');
    var types = T.MODES.filter(function (m) { return m.id !== 'counter'; });
    var st = editing
      ? { name: editing.name, mode: editing.mode, cfg: Object.assign(T.defaultConfig(editing.mode), editing.cfg), numbered: !!editing.numbered, lines: JSON.parse(JSON.stringify(editing.lines)) }
      : { name: '', mode: 'emom', cfg: Store.config('emom'), numbered: false, lines: [] };

    app.innerHTML = '<div class="screen">' + header(editing ? 'Editar entrenamiento' : 'Crear entrenamiento', { back: '#/presets' }) +
      '<div class="panel"><div class="field"><div class="flabel">Nombre</div><input class="text-in" id="p-name" maxlength="60" autocomplete="off" placeholder="Ej. EMOM 12\' · Piernas" value="' + esc(st.name) + '"></div>' +
      '<div class="field"><div class="flabel">Tipo de entreno</div><select class="text-in" id="p-mode">' +
      types.map(function (m) { return '<option value="' + m.id + '"' + (m.id === st.mode ? ' selected' : '') + '>' + esc(m.name) + '</option>'; }).join('') +
      '</select></div></div>' +
      '<div class="panel" id="p-fields"></div><div class="total" id="total"></div>' +
      '<div class="error" id="p-err" role="alert" hidden></div>' +
      '<div class="panel"><h2>Ejercicios</h2>' +
      '<p class="hint">Elige los ejercicios de tu lista. Las repeticiones, calorías o metros los escribes tú a mano.</p>' +
      '<label class="switch"><span>Numerar los ejercicios (1., 2., 3.…)</span><input type="checkbox" id="p-num"' + (st.numbered ? ' checked' : '') + '></label>' +
      '<div id="p-lines"></div>' +
      '<div class="row" style="margin-top:12px"><button class="btn small" id="add-ex">' + ICON.plus + 'Ejercicio</button><button class="btn small" id="add-txt">' + ICON.plus + 'Texto</button></div></div>' +
      '<button class="btn primary block" id="p-save">' + ICON.saved + 'Guardar</button></div>';

    function mountFields() { $('#p-fields').innerHTML = fieldsHtml(T.getMode(st.mode)); refresh(); }
    function refresh() { var mode = T.getMode(st.mode); refreshFields(mode, st.cfg); $('#total').innerHTML = totalHtml(st.mode, st.cfg); updateError(); }
    function updateError() {
      var err = T.validateLines(st.mode, st.cfg, st.lines.filter(function (l) { return l.t === 'txt' || l.parts.some(function (p) { return p.ex; }); }));
      var el = $('#p-err'); el.hidden = !err; el.textContent = err ? 'Error: ' + err : '';
      return err;
    }

    function optionsHtml(sel) {
      return '<option value="">Elige un ejercicio…</option>' + Store.exercises().map(function (e) {
        return '<option value="' + esc(e.id) + '"' + (e.id === sel ? ' selected' : '') + '>' + esc(e.name) + '</option>';
      }).join('');
    }
    function mountLines() {
      var h = '';
      if (!st.lines.length) h += '<div class="empty" style="margin:12px 0 0">Aún no hay ejercicios. Toca "+ Ejercicio".</div>';
      st.lines.forEach(function (l, i) {
        h += '<div class="ed-line" data-li="' + i + '"><div class="ed-head"><span class="ed-title">' + (l.t === 'txt' ? 'Texto' : 'Ejercicio') + '</span><span class="ed-btns">' +
          '<button class="icon-btn mini" data-act="up" aria-label="Subir"' + (i === 0 ? ' disabled' : '') + '>' + ICON.up + '</button>' +
          '<button class="icon-btn mini" data-act="down" aria-label="Bajar"' + (i === st.lines.length - 1 ? ' disabled' : '') + '>' + ICON.down + '</button>' +
          '<button class="icon-btn mini" data-act="del" aria-label="Quitar">' + ICON.trash + '</button></span></div>';
        if (l.t === 'txt') {
          h += '<input class="text-in" data-k="text" maxlength="80" placeholder="Texto libre: 21-15-9, Buy out…" value="' + esc(l.text) + '">';
        } else {
          l.parts.forEach(function (pt, pi) {
            h += '<div class="ed-part" data-pi="' + pi + '"><input class="text-in qty" data-k="qty" maxlength="20" placeholder="Reps / cal / m" value="' + esc(pt.qty) + '" aria-label="Repeticiones, calorías o metros">' +
              '<select class="text-in" data-k="ex" aria-label="Ejercicio">' + optionsHtml(pt.ex) + '</select>' +
              (pt.ex ? infoBtn(pt.ex) : '') +
              (l.parts.length > 1 ? '<button class="icon-btn mini" data-act="delpart" aria-label="Quitar este ejercicio">' + ICON.trash + '</button>' : '') + '</div>';
          });
          h += '<button class="btn small" data-act="addpart" style="margin:8px 0">' + ICON.plus + 'Otro ejercicio en la misma línea</button>' +
            '<input class="text-in" data-k="note" maxlength="40" placeholder="Nota (opcional): juntos, heavy…" value="' + esc(l.note || '') + '">';
        }
        h += '</div>';
      });
      $('#p-lines').innerHTML = h;
      updateError();
    }
    mountFields(); mountLines();

    function onClick(e) {
      if (stepField(T.getMode(st.mode), st.cfg, e.target)) { refresh(); return; }
      var act = e.target.closest('[data-act]');
      if (!act || act.disabled) return;
      var lineEl = act.closest('.ed-line'), i = lineEl ? +lineEl.dataset.li : -1, a = act.dataset.act;
      if (a === 'up' && i > 0) { var t = st.lines[i - 1]; st.lines[i - 1] = st.lines[i]; st.lines[i] = t; }
      else if (a === 'down' && i < st.lines.length - 1) { var t2 = st.lines[i + 1]; st.lines[i + 1] = st.lines[i]; st.lines[i] = t2; }
      else if (a === 'del') st.lines.splice(i, 1);
      else if (a === 'addpart') st.lines[i].parts.push({ ex: '', qty: '' });
      else if (a === 'delpart') st.lines[i].parts.splice(+act.closest('.ed-part').dataset.pi, 1);
      mountLines();
    }
    function onInput(e) {
      var t = e.target;
      if (t.id === 'p-name') { st.name = t.value; return; }
      if (t.id === 'p-num') { st.numbered = t.checked; return; }
      if (t.id === 'p-mode') {
        st.mode = t.value;
        st.cfg = (editing && editing.mode === st.mode) ? Object.assign(T.defaultConfig(st.mode), editing.cfg) : Store.config(st.mode);
        mountFields(); return;
      }
      var lineEl = t.closest('.ed-line');
      if (!lineEl || !t.dataset.k) return;
      var l = st.lines[+lineEl.dataset.li], k = t.dataset.k;
      if (k === 'text') l.text = t.value;
      else if (k === 'note') l.note = t.value;
      else {
        var pt = l.parts[+t.closest('.ed-part').dataset.pi];
        pt[k] = t.value;
        if (k === 'ex') mountLines();   // para mostrar el (i) del ejercicio elegido y revisar el error
      }

    app.addEventListener('click', onClick);
    app.addEventListener('input', onInput);

    $('#add-ex').addEventListener('click', function () { st.lines.push({ t: 'ex', parts: [{ ex: '', qty: '' }], note: '' }); mountLines(); });
    $('#add-txt').addEventListener('click', function () { st.lines.push({ t: 'txt', text: '' }); mountLines(); });
    $('#p-save').addEventListener('click', function () {
      var name = st.name.trim();
      if (!name) { toast('Ponle un nombre al entreno'); $('#p-name').focus(); return; }
      var lines = [], bad = false;
      st.lines.forEach(function (l) {
        if (l.t === 'txt') { if (l.text.trim()) lines.push({ t: 'txt', text: l.text.trim() }); return; }
        var parts = [];
        l.parts.forEach(function (pt) {
          if (pt.ex) parts.push({ ex: pt.ex, qty: pt.qty.trim() });
          else if (pt.qty.trim()) bad = true;
        });
        if (parts.length) lines.push({ t: 'ex', parts: parts, note: (l.note || '').trim() });
      });
      if (bad) { toast('Hay una línea con cantidad pero sin ejercicio'); return; }
      var verr = T.validateLines(st.mode, st.cfg, lines);
      if (verr) { toast('Error: ' + verr); $('#p-err').scrollIntoView && $('#p-err').scrollIntoView({ block: 'center' }); return; }
      var data = { name: name, mode: st.mode, cfg: Object.assign({}, st.cfg), numbered: st.numbered, lines: lines };
      if (editing) Store.updatePreset(editing.id, data); else Store.addPreset(data);

    });

  /* ---------- Pantalla del reloj ---------- */
  function wakeLock() {
    var lock = null, alive = true;
    function acquire() {
      if (!alive || !navigator.wakeLock) return;
      navigator.wakeLock.request('screen').then(function (l) { lock = l; }).catch(function () {});
    }
    function onVis() { if (document.visibilityState === 'visible') acquire(); }
    document.addEventListener('visibilitychange', onVis);
    acquire();
    return function () { alive = false; document.removeEventListener('visibilitychange', onVis); if (lock) lock.release().catch(function () {}); };
  }

  function viewCounter() {
    var count = Store.counter();
    app.innerHTML = '<div class="screen run counter-screen" data-type="work">' +
      '<div class="top"><button class="icon-btn" id="exit" aria-label="Salir">' + ICON.back + '</button>' +

      '<div class="counter-ctl"><button class="btn" id="minus" aria-label="Quitar una ronda">−</button>' +

    var blue = new window.LED($('#led-blue'), 'DD');

    function add(d) {

    }
    draw();
    $('#plus').addEventListener('click', function () { add(1); });
    $('#minus').addEventListener('click', function () { add(-1); });
    $('#led-blue').addEventListener('click', function () { add(1); });
    $('#reset').addEventListener('click', function () { if (count === 0 || window.confirm('¿Poner el contador a cero?')) { count = 0; Store.setCounter(0); draw(); } });
    $('#exit').addEventListener('click', function () { go('#/'); });
    var wl = wakeLock();
    var unfit = window.LED.autoFit($('.stage'), $('.display'), $('.bezel'), 120);
    cleanup = function () { wl(); unfit(); };
